
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080D18"/>
      <stop offset="55%" stop-color="#101D32"/>
      <stop offset="100%" stop-color="#123D4A"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="100%" stop-color="#67E8F9" stop-opacity=".6"/>
    </linearGradient>
    <clipPath id="radarClip">
      <circle cx="900" cy="210" r="142"/>
    </clipPath>
  </defs>

  <rect width="1200" height="420" rx="18" fill="url(#bg)"/>
  <circle cx="900" cy="210" r="230" fill="url(#glow)"/>

  <!-- Technical grid -->
  <g stroke="#7DD3FC" stroke-opacity=".065" stroke-width="1">
    <path d="M0 70H1200 M0 140H1200 M0 210H1200 M0 280H1200 M0 350H1200"/>
    <path d="M100 0V420 M200 0V420 M300 0V420 M400 0V420
             M500 0V420 M600 0V420 M700 0V420 M800 0V420
             M900 0V420 M1000 0V420 M1100 0V420"/>
  </g>

  <!-- Brand -->
  <rect x="72" y="78" width="4" height="190" rx="2" fill="#67E8F9"/>
  <text x="100" y="112" fill="#67E8F9" font-family="monospace"
        font-size="14" letter-spacing="4">WORKFLOW INTELLIGENCE</text>
  <text x="96" y="183" fill="#F0F9FF" font-family="Arial, sans-serif"
        font-weight="700" font-size="60" letter-spacing="-2">GHOST QUEUE</text>
  <text x="100" y="225" fill="#C2D5E4" font-family="Arial, sans-serif"
        font-size="20">Find the People a System Has Forgotten.</text>
  <text x="100" y="272" fill="#67E8F9" font-family="monospace"
        font-size="13" letter-spacing="2">DETECT  /  EXPLAIN  /  PRIORITIZE</text>

  <path d="M100 306H490" stroke="#67E8F9" stroke-opacity=".35"/>
  <text x="100" y="337" fill="#8DA8BC" font-family="monospace"
        font-size="12" letter-spacing="1.5">AI SYNERGY HACKATHON 2026  ·  HACKLABS</text>

  <!-- Radar rings -->
  <g fill="none" stroke="#67E8F9" stroke-opacity=".24">
    <circle cx="900" cy="210" r="35"/>
    <circle cx="900" cy="210" r="70"/>
    <circle cx="900" cy="210" r="105"/>
    <circle cx="900" cy="210" r="142"/>
    <path d="M758 210H1042 M900 68V352 M799 109L1001 311 M799 311L1001 109"/>
  </g>

  <!-- Rotating sweep -->
  <g clip-path="url(#radarClip)">
    <path d="M900 210 L900 68 A142 142 0 0 1 1000 109 Z"
          fill="url(#sweep)">
      <animateTransform attributeName="transform" type="rotate"
        from="0 900 210" to="360 900 210"
        dur="8s" repeatCount="indefinite"/>
    </path>
    <path d="M900 210L900 68" stroke="#67E8F9" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate"
        from="0 900 210" to="360 900 210"
        dur="8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Signal nodes -->
  <g fill="#67E8F9">
    <circle cx="942" cy="121" r="4">
      <animate attributeName="opacity" values=".35;1;.35"
        dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="831" cy="176" r="3">
      <animate attributeName="opacity" values="1;.25;1"
        dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="964" cy="260" r="4">
      <animate attributeName="opacity" values=".25;1;.25"
        dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="864" cy="299" r="3">
      <animate attributeName="opacity" values="1;.3;1"
        dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="900" cy="210" r="5" fill="#F0FDFF"/>
  </g>

  <!-- Scanning line -->
  <rect x="720" y="72" width="360" height="2" fill="#67E8F9" opacity=".8">
    <animate attributeName="y" values="72;350;72"
      dur="6s" repeatCount="indefinite"/>
  </rect>

  <text x="900" y="390" fill="#8DA8BC" font-family="monospace"
        font-size="11" text-anchor="middle" letter-spacing="2">
    SYSTEM MONITOR / SIGNAL DETECTION
  </text>
</svg>
